name: Publish generated Hugging Face Space wrapper

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type yes to replace the Space with the generated five-file wrapper
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.event.inputs.confirm == 'yes'
    runs-on: ubuntu-latest
    env:
      SPACE_ID: BlueSkyXN/ImageMagickAPI-HFS
      BUNDLE_DIR: .hfs-export
      READBACK_DIR: .hfs-readback
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python for export and Hugging Face CLI
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run static HFS checks
        run: ./scripts/static-check.sh

      - name: Export the five-file Space wrapper
        run: |
          mkdir "$BUNDLE_DIR"
          ./cloud/hfs/export_space_bundle.sh --output "$BUNDLE_DIR" --commit "${{ github.sha }}"
          test "$(find "$BUNDLE_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 5

      - name: Install Hugging Face CLI
        run: python -m pip install --disable-pip-version-check huggingface_hub

      - name: Guardedly replace the Space contents
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # --delete '*' explicitly removes old full-repository Space files that are not in this bundle.
          hf upload "$SPACE_ID" "$BUNDLE_DIR" . \
            --repo-type space \
            --delete '*' \
            --commit-message "Publish generated wrapper for ${{ github.sha }}"

      - name: Read back critical generated files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir "$READBACK_DIR"
          for file in Dockerfile README.md hfs-dev.toml BUILD_SOURCE.txt .dockerignore; do
            hf download "$SPACE_ID" "$file" --repo-type space --local-dir "$READBACK_DIR"
            cmp "$BUNDLE_DIR/$file" "$READBACK_DIR/$file"
          done
